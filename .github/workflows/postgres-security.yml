name: Hayel PostgreSQL Security

on:
  push:
    branches: [main, 'mu/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hayel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hayel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d hayel_test -c 'select version();'

      - name: Run persistence migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in packages/persistence/schema/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hayel_test -f "$f"
          done

      - name: Verify RLS metadata
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hayel_test <<'SQL'
          SELECT c.relname, c.relrowsecurity, c.relforcerowsecurity
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relname IN ('organizations','users','employees','employments')
          ORDER BY c.relname;
          SQL

      - name: Run persistence tests
        run: pnpm test -- packages/persistence
