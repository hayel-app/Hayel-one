name: Hayel Quality

on:
  push:
    branches: ['mu/foundation-v1']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hayel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hayel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hayel
      HAYEL_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/hayel
      HAYEL_APP_PASSWORD: hayel_ci_app_password
      HAYEL_POSTGRES_APP_URL: postgresql://hayel_app:hayel_ci_app_password@127.0.0.1:5432/hayel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mu/foundation-v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile exists
        run: test -s pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate PostgreSQL
        run: pnpm --filter @hayel/persistence migrate

      - name: Verify database security boundary
        run: |
          psql "$HAYEL_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'hayel_app';"
          psql "$HAYEL_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "SELECT relname, relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname IN ('organizations','users','employees','employments') ORDER BY relname;"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
